<!DOCTYPE html>
<html>
<head>
<title>BTech Dashboard</title>
<style>
body{font-family:Arial;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;max-width:400px;width:90%}
h1{color:#2d2dc7}
button{background:#2d2dc7;color:white;border:none;padding:12px 25px;border-radius:10px;cursor:pointer;margin-top:20px;font-size:16px}
button:hover{background:#1a1a9c}
</style>
</head>
<body>
<div class="card">
<h1>Welcome! 🎉</h1>
<p id="userInfo">Loading...</p>
<p>BTech Computer Engineering<br>Class Portal 2026</p>
<button onclick="logout()">Logout</button>
</div>
<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
if(!user.id){ window.location.href='index.html'; }
document.getElementById('userInfo').innerHTML = `<b>${user.role}</b><br>${user.id}`;
function logout(){
 localStorage.removeItem('user');
 window.location.href='index.html';
}
</script>
</body>
</html>
